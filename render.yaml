# Hébergement de Nelyo — arbitrage du 09/09 : PaaS, et Render plutôt que Fly.
#
# LE MOTIF EST LE CRON, pas le prix. Fly ne planifie nativement qu'en hourly/daily/weekly ;
# un passage toutes les dix minutes y demanderait d'embarquer Supercronic ou Cron Manager,
# c'est-à-dire de maintenir un ordonnanceur dans notre conteneur. Or c'est exactement le
# risque identifié le 09/09 : un processus permanent bloqué sur une exception avalée
# ressemble à un processus en bonne santé. Render a le cron comme TYPE DE SERVICE, en
# syntaxe Unix — et `worker.py` reste UN PASSAGE, ce qui le rend testable et idempotent.
#
# Une heure d'attente serait intenable : la file sortante porte le SMS de confirmation
# client. Un client qui attend soixante minutes après un « c'est réservé », c'est le cœur
# du produit qui se dégrade.
#
# CE QUE CE FICHIER DÉBLOQUE, au-delà du cron : une URL PUBLIQUE STABLE. Aujourd'hui tout
# vit derrière un tunnel depuis un portable — le lien de validation du SMS meurt avec le
# tunnel, alors qu'il est censé être cliqué par un client deux heures après l'appel, et
# l'assistant Vapi pointe sur une URL éphémère. Le front n'est pas le goulot, son
# accessibilité l'est.
#
# ⚠️ LES MIGRATIONS NE SONT PAS JOUÉES AU DÉPLOIEMENT, et c'est volontaire : un `deploy`
#    ne doit pas pouvoir toucher au schéma d'une base de production par surprise. Elles
#    restent manuelles : `python run_depot_pg.py --migrer`.

services:
  # ------------------------------------------------------------------ l'API + le front
  - name: nelyo-api
    type: web
    runtime: python
    branch: main               # ⚠️ PAS `wip`. Le workflow du projet est « commit+push à
                               # chaque fin de session, 2 machines » : déployer depuis
                               # l'établi ferait partir en production un travail laissé à
                               # moitié sur l'autre machine. `main` = ce qui tourne, `wip` =
                               # ce qu'on fabrique ; la mise en prod est un merge qu'on
                               # relit, comme le commit qui passera `RELAIS_SMS` à `ovh`.
    region: frankfurt          # UE : RGPD, et la latence compte à chaque tour d'appel
    plan: starter              # ⚠️ PAS le palier gratuit : il s'endort après inactivité, et
                               # Vapi attend notre réponse en ~1 s. Un démarrage à froid ne
                               # rate pas « une requête », il tue le PREMIER TOUR de l'appel.
    rootDir: proto
    buildCommand: pip install -r requirements.txt
    # `RELAIS_VERSION` : sans lui, `serveur.py` tente `git rev-parse` et retomberait sur
    # « inconnue » si le conteneur n'a pas de dépôt git — ce qui viderait R65 de son sens
    # (« dater ce qui tourne doit être une donnée, pas un raisonnement »). Render expose le
    # commit déployé ; l'override existe déjà dans le code, on s'en sert. Le `:-` garantit
    # qu'une variable absente ne casse pas le démarrage.
    # `RELAIS_BASE_URL` : repli sur `RENDER_EXTERNAL_URL`, que Render peuple pour les
    # services WEB (et laisse vide partout ailleurs — ce qui confirme au passage qu'elle
    # n'a rien à faire sur le cron). Ce repli SUPPRIME l'œuf et la poule au lieu de le
    # documenter : `serveur.py` exige cette variable au démarrage, or le domaine n'est
    # attribué qu'une fois le service créé — le premier déploiement échouait donc
    # forcément. `${VAR:-defaut}` se déclenche sur une variable absente OU VIDE, et
    # l'explicite garde la priorité : le jour du domaine propre (nelyo-ia.*), on renseigne
    # la variable et le repli s'efface tout seul. Un piège qu'on peut coder ne se note pas.
    startCommand: >-
      RELAIS_VERSION="${RENDER_GIT_COMMIT:-inconnue}"
      RELAIS_BASE_URL="${RELAIS_BASE_URL:-$RENDER_EXTERNAL_URL}"
      uvicorn serveur:app --host 0.0.0.0 --port $PORT

    # PAS de `healthCheckPath`, et c'est un choix. `/sante` interroge la base (il rend le
    # dernier passage du worker) : en faire le contrôle de vivacité, c'est faire redémarrer
    # l'application quand Supabase hoquette — un incident de DÉPENDANCE transformé en
    # incident de PROCESSUS, et un redémarrage ne répare pas une base injoignable. Render
    # vérifie déjà que le port écoute, ce qui est la question à laquelle un contrôle de
    # vivacité doit répondre. `/sante` reste ce qu'on interroge SOI-MÊME pour savoir la
    # vérité (révision déployée, dernier passage du worker) — une donnée, pas une gâchette.

    envVars:
      # ⚠️ ÉPINGLÉ, et ce n'est pas de la prudence de principe : le défaut de Render pour un
      # service créé aujourd'hui est **Python 3.14.3**, alors que tout ce qui est mesuré ici
      # l'a été en 3.13. Un déploiement de production n'est pas l'endroit où l'on découvre
      # une version majeure. La variable exige une version COMPLÈTE (un `.python-version`
      # accepterait `3.13`, mais il doit vivre à la racine du DÉPÔT, pas dans `rootDir` —
      # donc loin de ce fichier et de ses raisons). À relever délibérément, jamais à subir.
      - key: PYTHON_VERSION
        value: "3.13.15"
      - key: DATABASE_URL          # connexion directe Supabase
        sync: false
      - key: DATABASE_URL_POOLER   # repli (pooler) — cf. run_depot_pg.py
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: RELAIS_WEBHOOK_SECRET # porte de la plateforme vocale (Vapi : champ « API Key »)
        sync: false
      - key: RELAIS_MODEL          # PAS un secret : une DÉCISION, et elle est mesurée.
        value: claude-haiku-4-5    # Le 01/09, Haiku et Sonnet à égalité de justesse
                                   # (36/36) mais 1,5 à 5 s de latence en plus par tour
                                   # pour Sonnet, avec un timeout client à 10 s. Une
                                   # décision documentée par des chiffres se versionne ;
                                   # la mettre en `sync: false` la reléguerait dans un
                                   # champ de tableau de bord que personne ne relit.
                                   # `RELAIS_MODEL_EXTRACTEUR` / `_FORMULEUR` se règlent
                                   # séparément le jour où la mesure le justifiera.
      - key: RELAIS_BASE_URL       # l'URL PUBLIQUE de ce service : elle compose les liens
        sync: false                # des SMS et l'URL du custom LLM de l'assistant Vapi.
                                   #
                                   # PEUT ÊTRE LAISSÉE VIDE à la création du service : le
                                   # `startCommand` retombe alors sur `RENDER_EXTERNAL_URL`
                                   # (cf. son commentaire). Elle reste déclarée ici parce
                                   # qu'elle devra être renseignée le jour du domaine
                                   # propre (nelyo-ia.*) — un lien SMS censé être cliqué
                                   # deux heures plus tard ne doit pas porter une adresse
                                   # qu'on prévoit d'abandonner.
      - key: RELAIS_COOKIE_SECURE  # « true » ici : on est en https, et le cookie de session
        value: "true"              # de l'artisan n'a aucune raison de voyager en clair.

  # ------------------------------------------------------------------ le worker de fond
  - name: nelyo-worker
    type: cron
    runtime: python
    branch: main               # même branche que l'API, et pour la même raison : les deux
                               # services partagent un schéma de base. Les voir diverger
                               # serait un worker qui écrit un format que l'API ne lit pas.
    region: frankfurt
    plan: starter
    rootDir: proto
    schedule: "*/10 * * * *"   # expiration des RDV + expédition de la file. Dix minutes :
                               # assez fin pour que le SMS de confirmation ne traîne pas,
                               # assez espacé pour ne pas marteler la base. Les échéances,
                               # elles, ne dépendent PAS du cron — c'est l'échéance qui fait
                               # foi (décision verrouillée), le worker ne fait que constater.
    buildCommand: pip install -r requirements.txt
    startCommand: python worker.py

    envVars:
      - key: PYTHON_VERSION        # même épinglage que l'API — cf. le commentaire là-haut
        value: "3.13.15"
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_POOLER
        sync: false
      # PAS de `RELAIS_BASE_URL` ici, et c'est vérifié plutôt que supposé : la seule chose
      # qui fabrique une URL est `confirmation.lien()`, appelée depuis `api.py` et de nulle
      # part ailleurs. Le worker n'écrit au client que par `expiration_client`, un gabarit
      # SANS lien (le lien coûterait ~43 caractères, donc un second crédit — cf. R23). La
      # déclarer ici coûtait un `sync: false` de plus à renseigner, pour une variable que
      # personne ne lit, sous un commentaire qui affirmait le contraire du code.
      - key: RELAIS_SMS            # ⚠️ VALEUR EN DUR, PAS `sync: false` : le défaut
        value: journal             # inoffensif doit être VERSIONNÉ. Passer à « ovh » envoie
                                   # de vrais SMS à de vrais clients ; ça doit être un
                                   # commit qu'on relit, pas une case cochée un soir dans un
                                   # tableau de bord. Le jour venu : cette ligne + les
                                   # quatre OVH_* en `sync: false`.
